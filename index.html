     ========================================================= -->

<script>

(function(){

  'use strict';


  /*
   * CARGAR PIXEL
   */

  !function(f,b,e,v,n,t,s){

    if(f.fbq)return;

    n=f.fbq=function(){

      n.callMethod ?
        n.callMethod.apply(
          n,
          arguments
        ) :
        n.queue.push(arguments);

    };


    if(!f._fbq)
      f._fbq=n;


    n.push=n;

    n.loaded=true;

    n.version='2.0';

    n.queue=[];


    t=b.createElement(e);

    t.async=true;

    t.src=v;

    s=b.getElementsByTagName(e)[0];

    s.parentNode.insertBefore(t,s);

  }(
    window,
    document,
    'script',
    'https://connect.facebook.net/en_US/fbevents.js'
  );


  /*
   * INICIALIZAR PIXEL TRIBET
   */

  fbq(
    'init',
    '1628936452188552'
  );


  /*
   * PAGEVIEW
   */

  fbq(
    'track',
    'PageView'
  );


  console.log(

<style>

/* =========================================================
   RESET
   ========================================================= */

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}


/* =========================================================
   HTML / BODY
   ========================================================= */

html,
body{

  width:100%;

  height:100%;

  min-height:100%;

  overflow:hidden;

  background:#08040d;

}


/* =========================================================
   CHATWEB
   OCUPA TODA LA PANTALLA
   ========================================================= */

#kommoChatFrame{

  position:fixed;

  inset:0;

  width:100vw;

  height:100vh;

  height:100dvh;

  background:#08040d;

  visibility:hidden;

  opacity:0;

  z-index:9999;

  transition:
    opacity 0.15s ease,
    visibility 0.15s ease;

}


/* =========================================================
   CHAT ABIERTO
   ========================================================= */

#kommoChatFrame.is-open{

  visibility:visible;

  opacity:1;

}


/* =========================================================
   IFRAME KOMMO
   ========================================================= */

#kommoChatFrame iframe{

  width:100% !important;

  height:100% !important;

  min-height:100% !important;

  border:0 !important;

  display:block !important;

}


/* =========================================================
   LOADING
   ========================================================= */

#loading{

  position:fixed;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:14px;

  background:#08040d;

  color:#D4AF37;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  z-index:9998;

  transition:
    opacity 0.2s ease;

}


/* =========================================================
   SPINNER
   ========================================================= */

.spinner{

  width:38px;

  height:38px;

  border-radius:50%;

  border:
    3px solid
    rgba(212,175,55,0.2);

  border-top-color:#D4AF37;

  animation:
    spin 0.8s linear infinite;

}


.loading-text{

  font-size:13px;

  font-weight:700;

  letter-spacing:0.3px;

}


/* =========================================================
   ANIMACIÓN
   ========================================================= */

@keyframes spin{

  from{

    transform:rotate(0deg);

  }

  to{

    transform:rotate(360deg);

  }

}

</style>

</head>


<body>


<!-- =========================================================
     LOADING
     ========================================================= -->

<div id="loading">

  <div class="spinner"></div>

  <div class="loading-text">
    Cargando chat...
  </div>

</div>


<!-- =========================================================
     CHATWEB KOMMO
     ========================================================= -->

<div id="kommoChatFrame"></div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const loading =
  document.getElementById(
    'loading'
  );


/* =========================================================
   ESTADO
   ========================================================= */

let ready = false;


/* =========================================================
   MOSTRAR CHAT
   ========================================================= */

function openReal(){

  console.log(
    '🚀 ABRIENDO CHATWEB KOMMO'
  );


  /*
   * Mostrar contenedor
   */

  frame.classList.add(
    'is-open'
  );


  /*
   * Abrir ChatWeb
   */

  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '✅ CHATWEB TRIBET ABIERTO'
    );


  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO CHATWEB:',
      error
    );

  }


  /*
   * Ocultar loading
   */

  setTimeout(
    function(){

      loading.style.opacity = '0';

      setTimeout(
        function(){

          loading.style.display =
            'none';

        },
        200
      );

    },
    250
  );

}


/* =========================================================
   ESPERAR A KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    console.log(
      '⏳ Esperando Kommo...'
    );


    setTimeout(
      bind,
      100
    );

    return;

  }


  console.log(
    '⏳ Esperando ChatWeb Kommo...'
  );


  /*
   * Kommo confirma que el chat
   * está listo
   */

  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ CHATWEB KOMMO LISTO'
      );


      /*
       * ABRIR AUTOMÁTICAMENTE
       */

      openReal();

    }
  );

}


/* =========================================================
   INICIAR
   ========================================================= */

bind();

</script>


</body>
</html>
