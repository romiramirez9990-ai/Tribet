<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const closeBtn =
  document.getElementById(
    'kommoClose'
  );


const openBtn =
  document.getElementById(
    'openChatBtn'
  );


let ready = false;

let visitorSaved = false;


/* =========================================================
   WORKER TRIBET
   ========================================================= */

const ATTRIBUTION_WORKER =
  'https://cold-tooth-b7b8.romiramirez9990.workers.dev/';


/* =========================================================
   COOKIE
   ========================================================= */

function getCookie(name){

  const prefix =
    name + '=';

  const cookies =
    document.cookie.split(';');

  for(
    let i = 0;
    i < cookies.length;
    i++
  ){

    const cookie =
      cookies[i].trim();

    if(
      cookie.indexOf(prefix) === 0
    ){

      return decodeURIComponent(
        cookie.substring(
          prefix.length
        )
      );

    }

  }

  return null;

}


/* =========================================================
   FBP
   ========================================================= */

function getFBP(){

  return getCookie('_fbp');

}


/* =========================================================
   FBC
   ========================================================= */

function getFBC(){

  let fbc =
    getCookie('_fbc');


  if(fbc){

    return fbc;

  }


  const params =
    new URLSearchParams(
      window.location.search
    );


  const fbclid =
    params.get('fbclid');


  if(!fbclid){

    return null;

  }


  fbc =
    'fb.1.' +
    Date.now() +
    '.' +
    fbclid;


  try{

    document.cookie =
      '_fbc=' +
      encodeURIComponent(fbc) +
      '; path=/; max-age=7776000; SameSite=Lax';

  }catch(error){

    console.log(
      '⚠️ No se pudo guardar _fbc'
    );

  }


  return fbc;

}


/* =========================================================
   VISITANTE → CLOUDFLARE
   ========================================================= */

async function sendVisitorDataToWorker(){

  if(visitorSaved){

    return;

  }


  try{

    const fbp =
      getFBP();

    const fbc =
      getFBC();


    console.log(
      '========================================'
    );

    console.log(
      '🔎 VISITANTE TRIBET'
    );

    console.log(
      'FBP:',
      fbp || 'NO DISPONIBLE'
    );

    console.log(
      'FBC:',
      fbc || 'NO DISPONIBLE'
    );


    if(
      !fbp &&
      !fbc
    ){

      console.log(
        '⚠️ TODAVÍA NO HAY FBP/FBC'
      );

      return;

    }


    const response =
      await fetch(
        ATTRIBUTION_WORKER + 'visitor',
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

              fbp:
                fbp || null,

              fbc:
                fbc || null

            })

        }
      );


    const result =
      await response.text();


    console.log(
      '📡 WORKER STATUS:',
      response.status
    );

    console.log(
      '📡 WORKER RESPONSE:',
      result
    );


    if(response.ok){

      visitorSaved = true;

      console.log(
        '✅ VISITANTE GUARDADO EN WORKER'
      );

    }

  }catch(error){

    console.error(
      '❌ ERROR WORKER VISITOR:',
      error
    );

  }

}


/* =========================================================
   ENVIAR FBP/FBC A KOMMO

   TRIBET:
   FBP = 161526
   FBC = 161528
   ========================================================= */

function sendMetaAttributionToKommo(){

  try{

    if(
      typeof crm_plugin ===
      'undefined'
    ){

      console.log(
        '⚠️ crm_plugin todavía no disponible'
      );

      return false;

    }


    if(
      typeof crm_plugin.setMeta !==
      'function'
    ){

      console.log(
        '⚠️ crm_plugin.setMeta no disponible'
      );

      return false;

    }


    const fbp =
      getFBP();


    const fbc =
      getFBC();


    console.log(
      '========================================'
    );

    console.log(
      '🔎 ATRIBUCIÓN TRIBET → KOMMO'
    );

    console.log(
      'FBP:',
      fbp || 'NO DISPONIBLE'
    );

    console.log(
      'FBC:',
      fbc || 'NO DISPONIBLE'
    );


    const customFields = [];


    /* FBP TRIBET */

    if(fbp){

      customFields.push({

        id: 161526,

        values: [

          {
            value: String(fbp)
          }

        ]

      });

    }


    /* FBC TRIBET */

    if(fbc){

      customFields.push({

        id: 161528,

        values: [

          {
            value: String(fbc)
          }

        ]

      });

    }


    if(
      customFields.length === 0
    ){

      console.log(
        '⚠️ NO HAY FBP/FBC PARA KOMMO'
      );

      return false;

    }


    const payload = {

      contact: {

        custom_fields:
          customFields

      }

    };


    console.log(
      '📦 PAYLOAD KOMMO:',
      JSON.stringify(
        payload,
        null,
        2
      )
    );


    crm_plugin.setMeta(
      payload
    );


    console.log(
      '✅ FBP/FBC ENVIADOS A KOMMO'
    );


    return true;

  }catch(error){

    console.error(
      '❌ ERROR ENVIANDO FBP/FBC A KOMMO:',
      error
    );

    return false;

  }

}


/* =========================================================
   ESPERAR A KOMMO Y ENVIAR ATRIBUCIÓN
   ========================================================= */

function prepareKommoAttribution(){

  if(
    typeof crm_plugin !==
    'undefined' &&
    typeof crm_plugin.setMeta ===
    'function'
  ){

    sendMetaAttributionToKommo();

    return;

  }


  setTimeout(
    prepareKommoAttribution,
    200
  );

}


/* =========================================================
   ABRIR CHAT
   ========================================================= */

function openReal(){

  frame.classList.add(
    'is-open'
  );


  closeBtn.classList.add(
    'is-open'
  );


  try{

    /*
      IMPORTANTE:
      Volvemos a enviar los datos
      inmediatamente antes de abrir.
    */

    sendMetaAttributionToKommo();


    crmPlugin(
      'runChatShow'
    );


    console.log(
      '✅ CHATWEB TRIBET ABIERTO'
    );

  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO CHAT:',
      error
    );

  }

}


/* =========================================================
   BOTÓN
   ========================================================= */

function openChat(){

  if(!ready){

    console.log(
      '⏳ KOMMO TODAVÍA NO ESTÁ LISTO'
    );

    return;

  }


  openReal();

}


/* =========================================================
   CERRAR
   ========================================================= */

function closeChat(){

  frame.classList.remove(
    'is-open'
  );


  closeBtn.classList.remove(
    'is-open'
  );


  try{

    crmPlugin(
      'runChatHide'
    );

  }catch(error){}

}


/* =========================================================
   BIND KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      150
    );

    return;

  }


  console.log(
    '⏳ ESPERANDO CHATWEB KOMMO...'
  );


  /*
    PRIMER INTENTO:
    enviamos FBP/FBC apenas
    el plugin está disponible.
  */

  sendMetaAttributionToKommo();


  crmPlugin(
    'onChatReady',
    async function(){

      ready = true;


      console.log(
        '✅ CHATWEB KOMMO LISTO'
      );


      /*
        1. Guardar visitante
      */

      await sendVisitorDataToWorker();


      /*
        2. Enviar atribución
        a Kommo nuevamente
      */

      sendMetaAttributionToKommo();


      /*
        3. Abrir chat
      */

      setTimeout(
        function(){

          openReal();

        },
        300
      );

    }
  );

}


/* =========================================================
   REINTENTO VISITANTE
   ========================================================= */

setTimeout(
  function(){

    sendVisitorDataToWorker();

  },
  1200
);


/* =========================================================
   PREPARAR ATRIBUCIÓN
   ========================================================= */

prepareKommoAttribution();


/* =========================================================
   BOTONES
   ========================================================= */

openBtn.addEventListener(
  'click',
  openChat
);


closeBtn.addEventListener(
  'click',
  closeChat
);


/* =========================================================
   INICIAR
   ========================================================= */

bind();

</script>
