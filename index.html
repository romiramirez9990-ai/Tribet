  justify-content:center;

  border:none;

  border-radius:14px;

  padding:16px 20px;

  font-size:16px;

  font-weight:900;

  width:100%;

  cursor:pointer;

  animation:

.wa-btn:active{

/* =========================================================

   ========================================================= */

  }

  16%{

    transform:translateX(3px);

  }

  24%{

    transform:translateX(-2px);

  }

  32%{

    transform:translateX(2px);

  }

  40%{

    transform:translateX(0);

  100%{

  50%{

      0 8px 36px

  100%{

<!-- =========================================================
     CERRAR CHAT
     ========================================================= -->

  type="button"
  aria-label="Cerrar chat"
>

  ✕

</button>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const closeBtn =
  document.getElementById(
    'kommoClose'
  );


const openBtn =
  document.getElementById(
    'openChatBtn'
  );


let ready = false;

let contactSent = false;


/* =========================================================
   CONTACT
   =========================================================

   Se dispara UNA SOLA VEZ cuando
   se abre el ChatWeb.

   No depende de Cloudflare.
   No depende de Kommo webhook.
   No depende de un mensaje.
   ========================================================= */

function sendContactEvent(){

  if(contactSent){

    console.log(
      '⚠️ CONTACT YA ENVIADO'
    );

    return;

  }


  function trySend(){

    if(
      typeof window.fbq !==
      'function'
    ){

      console.log(
        '⏳ Esperando Meta Pixel...'
      );

      setTimeout(
        trySend,
        100
      );

      return;

    }


    try{

      window.fbq(
        'track',
        'Contact'
      );


      contactSent = true;


      console.log(
        '========================================'
      );

      console.log(
        '✅ EVENTO CONTACT ENVIADO A META'
      );

      console.log(
        '========================================'
      );


    }catch(error){

      console.error(
        '❌ ERROR ENVIANDO CONTACT:',
        error
      );

    }

  }


  trySend();

}


/* =========================================================
   ABRIR CHAT REAL
   ========================================================= */

function openReal(){

  /*
   * Mostrar inmediatamente
   */

  frame.classList.add(
    'is-open'
  );


  closeBtn.classList.add(
    'is-open'
  );


  /*
   * CONTACT
   *
   * Se registra al abrir ChatWeb.
   */

  sendContactEvent();


  /*
   * Abrir Kommo
   */

  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '✅ CHATWEB TRIBET ABIERTO'
    );


  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO CHATWEB:',
      error
    );

  }

}


/* =========================================================
   BOTÓN MANUAL
   ========================================================= */

function openChat(){

  if(!ready){

    console.log(
      '⏳ KOMMO TODAVÍA NO ESTÁ LISTO'
    );

    return;

  }


  openReal();

}


/* =========================================================
   CERRAR CHAT
   ========================================================= */

function closeChat(){

  frame.classList.remove(
    'is-open'
  );


  closeBtn.classList.remove(
    'is-open'
  );


  try{

    crmPlugin(
      'runChatHide'
    );

  }catch(error){}

}


/* =========================================================
   ESPERAR A KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      100
    );

    return;

  }


  console.log(
    '⏳ ESPERANDO CHATWEB KOMMO...'
  );


  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ CHATWEB KOMMO LISTO'
      );


      /*
       * ABRIR AUTOMÁTICAMENTE
       */

      openReal();

    }
  );

}


/* =========================================================
   BOTONES
   ========================================================= */

openBtn.addEventListener(
  'click',
  openChat
);


closeBtn.addEventListener(
  'click',
  closeChat
);


/* =========================================================
   INICIAR
   ========================================================= */

bind();

</script>
