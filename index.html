   ANIMACIONES
   ========================================================= */

  0%,

  }

  24%{

  }

  32%{

  }

  40%{

<!-- =========================================================
     JAVASCRIPT CHATWEB
     ========================================================= -->

<script>


const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const closeBtn =
  document.getElementById(
    'kommoClose'
  );


const openBtn =
  document.getElementById(
    'openChatBtn'
  );


let ready = false;


/* =========================================================
   ABRIR CHAT REAL
   ========================================================= */

function openReal(){

  frame.classList.add(
    'is-open'
  );


  closeBtn.classList.add(
    'is-open'
  );


  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '✅ ChatWeb Kommo abierto'
    );


  }catch(e){

    console.log(
      '❌ Error abriendo ChatWeb:',
      e
    );

  }

}


/* =========================================================
   ABRIR CHAT MANUALMENTE
   ========================================================= */

function openChat(){

  if(ready){

    openReal();

  }

}


/* =========================================================
   CERRAR CHAT
   ========================================================= */

function closeChat(){

  frame.classList.remove(
    'is-open'
  );


  closeBtn.classList.remove(
    'is-open'
  );


  try{

    crmPlugin(
      'runChatHide'
    );

  }catch(e){}

}


/* =========================================================
   ESPERAR A KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      150
    );

    return;

  }


  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ Kommo ChatWeb listo'
      );


      /*
        ABRIR AUTOMÁTICAMENTE
        AL ENTRAR A LA PÁGINA
      */

      setTimeout(
        function(){

          openReal();

        },
        300
      );

    }
  );

}


/* =========================================================
   BOTÓN
   ========================================================= */

openBtn.addEventListener(
  'click',
  openChat
);


closeBtn.addEventListener(
  'click',
  closeChat
);


/* =========================================================
   INICIAR
   ========================================================= */

bind();


</script>
